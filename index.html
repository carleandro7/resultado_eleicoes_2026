<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#182c53">
  <title>Painel Eleitoral</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // tema escolhido pela pessoa (o claro é o padrão), aplicado antes de desenhar a página para não piscar
    try { if (localStorage.getItem('painel-eleitoral-tema') === 'escuro') document.documentElement.dataset.theme = 'dark'; } catch (erro) {}
  </script>
</head>
<body>
  <main class="pagina">
    <!-- faixa da marca: título, resumo do estado e troca de tema -->
    <header class="topo">
      <div class="topo-interno">
        <div class="topo-textos">
          <p class="topo-marca">
            <svg class="topo-icone" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h16v7H4z"/><path d="M8 13V4h8v9"/><path d="m10 8.5 1.5 1.5L14 7.5"/></svg>
            Painel eleitoral
          </p>
          <h1 id="titulo">Painel eleitoral</h1>
          <p id="subtitulo" class="texto-sec"></p>
        </div>
        <button type="button" id="btn-tema" class="botao-tema" aria-pressed="false" title="Usar tema escuro">
          <svg class="icone-lua" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icone-sol" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
          <span class="botao-tema-texto">Tema escuro</span>
        </button>
      </div>
    </header>

    <div class="conteudo">
      <!-- filtros num cartão elevado, sobre a faixa da marca; candidatos escolhidos logo abaixo da busca -->
      <section class="filtros" aria-label="Filtros">
        <div class="filtros-grade">
          <label class="campo campo-estado">
            <span class="campo-rotulo">Estado</span>
            <select id="f-estado"></select>
          </label>
          <label class="campo campo-cargo">
            <span class="campo-rotulo">Cargo</span>
            <select id="f-eleicao"></select>
          </label>
          <label class="campo campo-cidade">
            <span class="campo-rotulo">Cidade</span>
            <select id="f-municipio"></select>
          </label>
          <label class="campo campo-zona">
            <span class="campo-rotulo">Zona</span>
            <select id="f-zona"></select>
          </label>
          <div class="campo campo-bairro">
            <label class="campo-rotulo" for="f-bairro">Bairro</label>
            <div class="combo">
              <svg class="icone-campo" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
              <input id="f-bairro" type="search" autocomplete="off" placeholder="Escolha a cidade antes" disabled
                     title="Digite para buscar o bairro da cidade escolhida"
                     role="combobox" aria-expanded="false" aria-controls="bairro-lista" aria-autocomplete="list">
              <ul id="bairro-lista" class="combo-lista combo-bairros" role="listbox" hidden></ul>
            </div>
          </div>
          <div class="campo campo-escola">
            <label class="campo-rotulo" for="f-local">Escola <span class="texto-mudo campo-dica">· digite para buscar</span></label>
            <div class="combo">
              <svg class="icone-campo" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
              <input id="f-local" type="search" autocomplete="off" placeholder="Todas as escolas"
                     title="Digite para buscar por nome, endereço, cidade ou zona"
                     role="combobox" aria-expanded="false" aria-controls="local-lista" aria-autocomplete="list">
              <ul id="local-lista" class="combo-lista combo-locais" role="listbox" hidden></ul>
            </div>
          </div>
          <div class="campo campo-candidatos">
            <label class="campo-rotulo" for="f-candidato">Candidatos <span id="cand-contagem" class="texto-mudo"></span></label>
            <div class="combo">
              <svg class="icone-campo" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
              <input id="f-candidato" type="search" autocomplete="off" placeholder="Buscar por nome ou número"
                     role="combobox" aria-expanded="false" aria-controls="combo-lista" aria-autocomplete="list">
              <ul id="combo-lista" class="combo-lista" role="listbox" aria-multiselectable="true" hidden></ul>
            </div>
          </div>
        </div>

        <div id="selecionados" class="chips" aria-live="polite"></div>

        <p id="status" class="status" role="status" aria-live="polite" hidden></p>
      </section>

      <section id="kpis" class="kpis" aria-label="Resumo"></section>

      <section class="cartao">
        <div class="cartao-topo">
          <div class="cartao-titulos">
            <h2 id="resumo-titulo"></h2>
            <p id="resumo-sub" class="texto-sec"></p>
          </div>
        </div>
        <div id="resumo" class="barras"></div>
      </section>

      <div class="agrupar">
        <span class="campo-rotulo" id="rotulo-agrupar">Ver por</span>
        <div class="abas" role="tablist" aria-labelledby="rotulo-agrupar">
          <button type="button" role="tab" data-aba="municipio" aria-selected="true">Cidade</button>
          <button type="button" role="tab" data-aba="zona" aria-selected="false">Zona</button>
          <button type="button" role="tab" data-aba="local" aria-selected="false">Escola</button>
        </div>
        <span class="texto-mudo agrupar-nota">vale para o mapa, o gráfico e a tabela</span>
      </div>

      <div class="graficos">
        <section class="cartao" id="cartao-mapa">
          <div class="cartao-topo">
            <div class="cartao-titulos">
              <h2 id="mapa-titulo">Mapa</h2>
              <p id="mapa-sub" class="texto-sec"></p>
            </div>
          </div>
          <!-- legenda antes dos dados, como no gráfico ao lado -->
          <div id="mapa-legenda" class="legenda"></div>
          <div id="mapa" class="mapa" aria-label="Mapa dos locais de votação"></div>
          <p id="mapa-nota" class="texto-mudo nota-pequena"></p>
        </section>

        <section class="cartao" id="cartao-barras">
          <div class="cartao-topo">
            <div class="cartao-titulos">
              <h2 id="barras-titulo">Gráfico</h2>
              <p id="barras-sub" class="texto-sec"></p>
            </div>
          </div>
          <div id="barras-legenda" class="legenda"></div>
          <div id="grafico-barras" class="barras"></div>
        </section>
      </div>

      <section class="cartao cartao-tabela">
        <div class="cartao-topo tabela-topo">
          <div class="cartao-titulos">
            <h2 id="tabela-titulo">Tabela</h2>
            <p id="tabela-nota" class="texto-sec tabela-nota"></p>
          </div>
          <div class="tabela-acoes">
            <div class="campo-busca">
              <svg class="icone-campo" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
              <input id="f-busca" type="search" placeholder="Filtrar linhas" aria-label="Filtrar linhas da tabela">
            </div>
            <button type="button" id="btn-csv" class="botao">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>
              Baixar CSV
            </button>
            <button type="button" id="btn-pdf" class="botao" title="Baixar um relatório em PDF com os números, o resumo e a tabela completa">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
              <span class="botao-rotulo">Baixar PDF</span>
            </button>
          </div>
        </div>
        <div class="tabela-rolagem">
          <table id="tabela">
            <thead></thead>
            <tbody></tbody>
            <tfoot></tfoot>
          </table>
        </div>
        <div class="tabela-rodape">
          <span id="contagem" class="texto-sec"></span>
          <button type="button" id="btn-mais" class="botao">
            Mostrar mais
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>
      </section>

      <footer class="rodape texto-mudo" id="rodape"></footer>
    </div>
  </main>

  <div id="dica" class="dica" role="tooltip" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="data/estados.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
